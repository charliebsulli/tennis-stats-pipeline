models:
  - name: matches
    columns:
      - name: match_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
      - name: tournament_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('tournaments')
                field: tournament_id
      - name: match_date
        tests:
          - not_null
      - name: round
        tests:
          - not_null
      - name: winner_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id
      - name: loser_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id

  - name: match_stats
    columns:
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('matches')
                field: match_id
      - name: player_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id
      - name: opponent_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id
      - name: won
        tests:
          - not_null
      - name: complete_stats
        tests:
          - not_null

  - name: tournaments
    columns:
      - name: tournament_id
        tests:
          - unique
          - not_null
      - name: name
        tests:
          - not_null
      - name: surface
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Hard', 'Clay', 'Grass', 'Carpet', 'Unknown']
      - name: tournament_level
        tests:
          - not_null

  - name: form
    columns:
      - name: player_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id
      - name: surface
        tests:
          - not_null
      - name: weighted_form
        tests:
          - not_null

  - name: head_to_head
    columns:
      - name: player_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id
      - name: opponent_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id
      - name: surface
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Hard', 'Clay', 'Grass', 'ALL']
      - name: wins
        tests:
          - not_null
      - name: losses
        tests:
          - not_null
      - name: matches_played
        tests:
          - not_null

  - name: player_surface_stats
    columns:
      - name: player_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'players')
                field: player_id
      - name: surface
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Hard', 'Clay', 'Grass', 'ALL']
      - name: season
        tests:
          - not_null
      - name: matches_played
        tests:
          - not_null
      - name: won
        tests:
          - not_null